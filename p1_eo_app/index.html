<html>
     <head> 
          <title> Even Odd App v1 </title>
          <style>
                 *{ 
                     font-size: 50px;
                     text-align:center;
                  }
                   body{ 
                        background-color:azure;
                    }
          </style>
      </head>
      <body>
       <h1> Even Odd App v1 </h1>
 
       <form onsubmit="check(event)">
                 <input type="number"  id="id_num"  placeholder="Enter Integer" />
                 <br/><br/>
                 <input type="submit"   value="Find Even/Odd" />
                 </form>
                 <h2 id="id_msg"></h2>


     <script> 
            function check(event)
            {
                    event.preventDefault();
                    let num = document.getElementById("id_num");
                    let msg = document.getElementById("id_msg");

                    if(num.value === "")
                    { 
                        alert("please enter integer");
                        msg.textContent = "";
                        num.focus();
                        return;
                    }

            let n = parseInt(num.value);
            let res = n % 2 === 0 ? "even" : "odd";
            msg.textContent = n + " is " + res;
            }
     </script>  


      </body>
</html>
